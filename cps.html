<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>CPS Test — GGS Arena · Klik Tercepat</title>
  <meta name="description" content="Tes CPS (click per second) GGS Arena — 10 detik, klik segila mungkin. Sikat leaderboard, buktiin switch mouse lo. GoodGamingShop." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Archivo+Black&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body class="ticks">
  <!-- sprite ikon minimal utk halaman ini -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <defs>
      <symbol id="ico-trophy" viewBox="0 0 24 24">
        <path d="M7 3 h10 v4 a5 5 0 0 1 -10 0 z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
        <path d="M7 4.5 H3.5 v1.5 a3 3 0 0 0 3.5 3" fill="none" stroke="currentColor" stroke-width="1.7"/>
        <path d="M17 4.5 H20.5 v1.5 a3 3 0 0 1 -3.5 3" fill="none" stroke="currentColor" stroke-width="1.7"/>
        <line x1="12" y1="12" x2="12" y2="16" stroke="currentColor" stroke-width="1.7"/>
        <path d="M8.5 20.5 h7 l-1 -3 h-5 z" fill="#E8401F" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
      </symbol>
    </defs>
  </svg>

  <div class="shell">
    <span class="tick-bl"></span><span class="tick-br"></span>

    <header class="masthead">
      <div class="brand">
        <img class="brand-logo" src="assets/ggs-logo-white.svg" alt="GoodGamingShop" />
        <div class="wordmark">
          <b>CPS TEST</b>
          <div class="tag micro">GGS Arena · Klik Tercepat · 10 Detik</div>
        </div>
      </div>
      <div class="spec">
        <div class="label">Station</div>
        <div class="val">04 / KLIK</div>
      </div>
    </header>

    <div class="touch-notice" id="touch-notice" hidden>
      📱 Lagi buka di HP? Santai — game-nya <b>bisa dimainin</b> buat latihan.
      Tapi skor cuma bisa masuk leaderboard kalau main di <b>PC pakai mouse &amp; keyboard</b> 🖱️⌨️
    </div>

    <section style="margin-top:18px">
      <div class="game-layout">
        <div class="game-main" id="mount-cps"></div>
        <aside>
          <div class="panel">
            <div class="panel-hd">
              <h3><svg class="ico-xs"><use href="#ico-trophy"/></svg>Leaderboard</h3>
              <div class="seg seg-sm" id="cps-scope">
                <button data-s="all" class="active">All-time</button>
                <button data-s="month">Bulan Ini</button>
              </div>
            </div>
            <div class="panel-bd" style="padding:8px 12px">
              <div class="lb" id="cps-board"></div>
            </div>
          </div>
          <a class="btn ghost block" href="index.html" style="margin-top:12px">← Main game lain di GGS Arena</a>
        </aside>
      </div>
    </section>

    <footer class="foot" style="border-top:1px solid var(--line-hair);margin-top:26px">
      <div class="foot-bottom" style="border-top:0">
        <span class="micro">GGS ARENA · goodgamingshop.com</span>
      </div>
    </footer>
  </div>

  <script type="module" src="js/cps-main.js"></script>
</body>
</html>
